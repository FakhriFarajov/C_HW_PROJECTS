<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Authentication</title>
  <script defer type="module" src="script.js"></script>
  <style>
    * { box-sizing: border-box; font-family: "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0;
      padding: 0;
      background: #f5f6fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .auth-container {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 8px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 380px;
    }
    h2 { text-align: center; margin-bottom: 24px; color: #333; }
    input, button {
      width: 100%; padding: 12px; margin-bottom: 16px;
      border-radius: 6px; font-size: 15px;
    }
    input {
      border: 1px solid #ccc;
    }
    input:focus {
      border-color: #007bff;
      outline: none;
    }
    button {
      background-color: #007bff; color: white; border: none;
      cursor: pointer; transition: background-color 0.2s ease;
    }
    button:hover { background-color: #0056b3; }
    .switch {
      margin-top: 20px; text-align: center;
      font-size: 14px; color: #555;
    }
    .switch span {
      color: #0056b3; cursor: pointer;
    }
    #auth-signUp-form { display: none; }
  </style>
</head>
<body>
  <div class="auth-container">
    <h2 id="auth-form-title">Sign In</h2>    
    
    <!-- Sign In -->
    <form id="auth-signIn-form">
      <input type="text" id="signInUsername" placeholder="Username" required />
      <input type="password" id="signInPassword" placeholder="Password" required />
      <button type="submit">Submit</button>
    </form>

    <!-- Sign Up -->
    <form id="auth-signUp-form">
      <input type="text" id="signUpUsername" placeholder="Username" required />
      <input type="email" id="signUpEmail" placeholder="Email" required />
      <input type="password" id="signUpPassword" placeholder="Password" required />
      <button type="submit">Submit</button>
    </form>
    
    <div class="switch">
      <a id="switchLink">Don't have an account? </a>
      <span id="SignInUpText">Sign Up</span>
    </div>
  </div>
</body>
</html>
