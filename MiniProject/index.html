<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Authentication</title>
  <script defer type="module" src="script.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <h2 id="auth-form-title">Sign In</h2>    
    
    <!-- Sign In -->
    <form id="auth-signIn-form">
      <input type="text" id="signInUsername" placeholder="Username" required />
      <input type="password" id="signInPassword" placeholder="Password" required />
      <button type="submit">Submit</button>
    </form>

    <!-- Sign Up -->
    <form id="auth-signUp-form">
      <input type="text" id="signUpUsername" placeholder="Username" required />
      <input type="email" id="signUpEmail" placeholder="Email" required />
      <input type="password" id="signUpPassword" placeholder="Password" required />
      <button type="submit">Submit</button>
    </form>
    
    <div class="switch">
      <a id="switchLink">Don't have an account? </a>
      <span id="SignInUpText">Sign Up</span>
    </div>
  </div>
</body>
</html>
