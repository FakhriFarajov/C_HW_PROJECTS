<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherAppMain</title>
    <script defer type="module" src="ScriptMain.js"></script>
    <link rel="stylesheet" href="MainPage.css">
</head>
<body>

    <div id="header">
        <div id="Titles">
            <h1 id="Username">Welcome , </h1>
        </div>
        <div id="Buttons">
            <button id="ChooseTheLocationButton">Choose the location</button>
            <button id="LogOut">LogOut</button>

        </div>
    </div>
    
    <div id="weather-container">
        <div id="weatherInfoList">
        </div>
        <div class="pagination">
            <button id="prevBtn">Previous</button>
            <span id="pageInfo"></span>
            <button id="nextBtn">Next</button>
        </div>
        
    </div>

    <div id="Maps">
        <div id="map"></div>
        <div id="coords">
            <p>Lat:</p>
            <input class="coord" type="text" id="latitude" readonly>
            <p>Long:</p>
            <input class="coord" type="text" id="longitude" readonly>
        </div>
        <button id="SaveButton">Save</button>
    </div>
    
    
    <script defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAZVr0qVqPJ_vATu7xUznSBWa04GgRQ1bA&callback=initMap">
    </script>
</body>
</html>
